name: Build CartaValor V03 APK

on:
  push:
    branches:
      - chatgpt-cartavalor-v03-build-20260928

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Reconstruct CartaValor V03 source
        run: |
          cat build-input/v03/part00.txt build-input/v03/part01.txt build-input/v03/part02.txt build-input/v03/part03.txt build-input/v03/part04.txt build-input/v03/part05.txt build-input/v03/part06.txt > build-input/v03/source.b64
          base64 -d build-input/v03/source.b64 > CartaValor_V03_source.zip
          unzip -t CartaValor_V03_source.zip
          unzip -q CartaValor_V03_source.zip -d .

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK 35
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: CartaValor_V03
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          test -f CartaValor_V03/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose CartaValor_V03/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CartaValor_V03-debug-apk
          path: CartaValor_V03/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
