name: Build CartaValor V17 APK

on:
  push:
    branches:
      - chatgpt-cartavalor-v17-build-20261003

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK 35
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare CartaValor V17
        run: bash v17patch/prepare_v17.sh

      - name: Build V17 debug APK
        working-directory: CartaValor_V03
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Run Android lint
        working-directory: CartaValor_V03
        run: gradle :app:lintDebug --stacktrace --no-daemon

      - name: Verify V17 APK
        run: |
          test -f CartaValor_V03/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose CartaValor_V03/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload V17 APK
        uses: actions/upload-artifact@v4
        with:
          name: CartaValor_V17-debug-apk
          path: CartaValor_V03/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload V17 lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CartaValor_V17-lint-report
          path: CartaValor_V03/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
