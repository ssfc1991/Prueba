name: Build Impulsa Explorer Clover Edition

on:
  push:
    branches:
      - impulsa-clover-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct known-good source
        shell: pwsh
        run: |
          $parts = Get-ChildItem "impulsa-color/source.part*.b64" | Sort-Object Name
          if ($parts.Count -ne 4) { throw "Expected 4 known-good source chunks, found $($parts.Count)" }
          $b64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          [IO.File]::WriteAllBytes("impulsa-base.zip", [Convert]::FromBase64String($b64))
          New-Item -ItemType Directory -Force -Path "clover-src" | Out-Null
          tar -xf "impulsa-base.zip" -C "clover-src"
          if ($LASTEXITCODE -ne 0) { throw "Could not extract known-good source" }
          $project = "clover-src/IMPULSA_EXPLORER_V01/src/ImpulsaExplorer/ImpulsaExplorer.csproj"
          if (-not (Test-Path $project)) { throw "Project reconstruction failed" }

      - name: Apply Clover Explorer Max overrides
        shell: pwsh
        run: |
          $root = "clover-src/IMPULSA_EXPLORER_V01/src/ImpulsaExplorer"
          Copy-Item "impulsa-clover-overrides/App.xaml" "$root/App.xaml" -Force
          Copy-Item "impulsa-clover-overrides/App.xaml.cs" "$root/App.xaml.cs" -Force
          Copy-Item "impulsa-clover-overrides/MainWindow.xaml" "$root/MainWindow.xaml" -Force
          Copy-Item "impulsa-clover-overrides/MainWindow.xaml.cs" "$root/MainWindow.xaml.cs" -Force
          Copy-Item "impulsa-clover-overrides/BrowserPane.xaml" "$root/Controls/BrowserPane.xaml" -Force
          Copy-Item "impulsa-clover-overrides/BrowserPane.xaml.cs" "$root/Controls/BrowserPane.xaml.cs" -Force
          Copy-Item "impulsa-clover-overrides/BrowserPane.ExplorerPro.cs" "$root/Controls/BrowserPane.ExplorerPro.cs" -Force
          Copy-Item "impulsa-clover-overrides/BrowserPane.NativeContext.cs" "$root/Controls/BrowserPane.NativeContext.cs" -Force
          Copy-Item "impulsa-clover-overrides/BrowserPane.MoreViews.cs" "$root/Controls/BrowserPane.MoreViews.cs" -Force
          Copy-Item "impulsa-clover-overrides/FileEntry.cs" "$root/Models/FileEntry.cs" -Force
          Copy-Item "impulsa-clover-overrides/QuickLocation.cs" "$root/Models/QuickLocation.cs" -Force
          Copy-Item "impulsa-clover-overrides/BreadcrumbItem.cs" "$root/Models/BreadcrumbItem.cs" -Force
          Copy-Item "impulsa-clover-overrides/TreeLocation.cs" "$root/Models/TreeLocation.cs" -Force
          Copy-Item "impulsa-clover-overrides/ShellIconService.cs" "$root/Services/ShellIconService.cs" -Force
          Copy-Item "impulsa-clover-overrides/NativeShellContextMenuService.cs" "$root/Services/NativeShellContextMenuService.cs" -Force
          Copy-Item "impulsa-clover-overrides/ShellMenuHostRunner.cs" "$root/Services/ShellMenuHostRunner.cs" -Force
          Copy-Item "impulsa-clover-overrides/ShellPropertiesService.cs" "$root/Services/ShellPropertiesService.cs" -Force
          Copy-Item "impulsa-clover-overrides/Directory.Build.targets" "$root/Directory.Build.targets" -Force

          $explorerPro = "$root/Controls/BrowserPane.ExplorerPro.cs"
          $text = Get-Content $explorerPro -Raw
          $needle = "        ApplyViewMode(ExplorerViewMode.Details);"
          if (-not $text.Contains($needle)) { throw "Could not hook native context menus" }
          $text = $text.Replace($needle, "$needle`r`n        InstallNativeContextMenus();")
          Set-Content -Path $explorerPro -Value $text -Encoding utf8

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore "clover-src/IMPULSA_EXPLORER_V01/src/ImpulsaExplorer/ImpulsaExplorer.csproj" -r win-x64

      - name: Publish portable Windows x64
        run: dotnet publish "clover-src/IMPULSA_EXPLORER_V01/src/ImpulsaExplorer/ImpulsaExplorer.csproj" -c Release -r win-x64 --self-contained true -p:Platform=x64 -p:WindowsAppSDKSelfContained=true -p:PublishTrimmed=false -p:PublishReadyToRun=false -o "${{ github.workspace }}\\artifact\\portable"

      - name: Verify executable and app PRI
        shell: pwsh
        run: |
          $out = Join-Path "${{ github.workspace }}" "artifact\\portable"
          $exe = Join-Path $out "ImpulsaExplorer.exe"
          if (-not (Test-Path $exe)) { throw "Portable executable was not generated" }
          $pris = @(Get-ChildItem $out -Filter "*.pri" -File)
          $pris | ForEach-Object { Write-Host "PRI: $($_.Name) $($_.Length) bytes" }
          $appPri = $pris | Where-Object { $_.Name -ieq 'ImpulsaExplorer.pri' -or $_.Name -ieq 'resources.pri' }
          if (-not $appPri) { throw "Application PRI is missing from publish output" }
          Get-Item $exe | Format-List FullName,Length,LastWriteTime

      - name: Smoke test startup
        shell: pwsh
        run: |
          $exe = Join-Path "${{ github.workspace }}" "artifact\\portable\\ImpulsaExplorer.exe"
          $desktop = [Environment]::GetFolderPath('DesktopDirectory')
          $log = Join-Path $desktop 'ImpulsaExplorer_Crash.log'
          if (Test-Path $log) { Remove-Item $log -Force }
          $p = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -PassThru
          Start-Sleep -Seconds 12
          if (Test-Path $log) {
            Write-Host 'Crash log detected:'
            Get-Content $log
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
            throw 'Impulsa Explorer generated a startup crash log.'
          }
          if ($p.HasExited) { throw "Impulsa Explorer exited during startup with code $($p.ExitCode)." }
          Stop-Process -Id $p.Id -Force
          Write-Host 'Startup smoke test passed.'

      - name: Upload Clover Safe Right Click portable
        uses: actions/upload-artifact@v4
        with:
          name: ImpulsaExplorer-CLOVER-SAFE-RIGHTCLICK-MORE-VIEWS-win-x64
          path: artifact/portable/**
          if-no-files-found: error
          retention-days: 7
