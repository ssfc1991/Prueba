name: Build Impulsa Explorer Clover Edition

on:
  push:
    branches:
      - impulsa-clover-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct known-good source
        shell: pwsh
        run: |
          $parts = Get-ChildItem "impulsa-color/source.part*.b64" | Sort-Object Name
          if ($parts.Count -ne 4) { throw "Expected 4 known-good source chunks, found $($parts.Count)" }
          $b64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          [IO.File]::WriteAllBytes("impulsa-base.zip", [Convert]::FromBase64String($b64))
          New-Item -ItemType Directory -Force -Path "clover-src" | Out-Null
          tar -xf "impulsa-base.zip" -C "clover-src"
          if ($LASTEXITCODE -ne 0) { throw "Could not extract known-good source" }
          $project = "clover-src/IMPULSA_EXPLORER_V01/src/ImpulsaExplorer/ImpulsaExplorer.csproj"
          if (-not (Test-Path $project)) { throw "Project reconstruction failed" }

      - name: Apply Clover Edition overrides
        shell: pwsh
        run: |
          $root = "clover-src/IMPULSA_EXPLORER_V01/src/ImpulsaExplorer"
          Copy-Item "impulsa-clover-overrides/App.xaml" "$root/App.xaml" -Force
          Copy-Item "impulsa-clover-overrides/MainWindow.xaml" "$root/MainWindow.xaml" -Force
          Copy-Item "impulsa-clover-overrides/MainWindow.xaml.cs" "$root/MainWindow.xaml.cs" -Force
          Copy-Item "impulsa-clover-overrides/BrowserPane.xaml" "$root/Controls/BrowserPane.xaml" -Force

          $fileEntry = "$root/Models/FileEntry.cs"
          $text = Get-Content $fileEntry -Raw
          $text = $text.Replace('public required string Name { get; init; }', 'public string Name { get; set; } = "";')
          $text = $text.Replace('public required string FullPath { get; init; }', 'public string FullPath { get; set; } = "";')
          $text = $text.Replace('{ get; init; }', '{ get; set; }')
          Set-Content -Path $fileEntry -Value $text -Encoding utf8

          $quickLocation = "$root/Models/QuickLocation.cs"
          $text = Get-Content $quickLocation -Raw
          $text = $text.Replace('public required string Name { get; init; }', 'public string Name { get; set; } = "";')
          $text = $text.Replace('public required string Path { get; init; }', 'public string Path { get; set; } = "";')
          $text = $text.Replace('public required string Glyph { get; init; }', 'public string Glyph { get; set; } = "";')
          Set-Content -Path $quickLocation -Value $text -Encoding utf8

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore "clover-src/IMPULSA_EXPLORER_V01/src/ImpulsaExplorer/ImpulsaExplorer.csproj" -r win-x64

      - name: Publish portable Windows x64
        run: dotnet publish "clover-src/IMPULSA_EXPLORER_V01/src/ImpulsaExplorer/ImpulsaExplorer.csproj" -c Release -r win-x64 --self-contained true -p:Platform=x64 -p:WindowsAppSDKSelfContained=true -p:PublishTrimmed=false -p:PublishReadyToRun=false -o "${{ github.workspace }}\\artifact\\portable"

      - name: Verify portable executable
        shell: pwsh
        run: |
          $exe = Join-Path "${{ github.workspace }}" "artifact\\portable\\ImpulsaExplorer.exe"
          if (-not (Test-Path $exe)) { throw "Portable executable was not generated" }
          Get-Item $exe | Format-List FullName,Length,LastWriteTime

      - name: Upload Clover portable
        uses: actions/upload-artifact@v4
        with:
          name: ImpulsaExplorer-CLOVER-PORTABLE-win-x64
          path: artifact/portable/**
          if-no-files-found: error
          retention-days: 7

      - name: Publish single EXE
        run: dotnet publish "clover-src/IMPULSA_EXPLORER_V01/src/ImpulsaExplorer/ImpulsaExplorer.csproj" -c Release -r win-x64 --self-contained true -p:Platform=x64 -p:WindowsAppSDKSelfContained=true -p:EnableMsixTooling=true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishTrimmed=false -p:PublishReadyToRun=false -o "${{ github.workspace }}\\artifact\\single"

      - name: Verify single executable
        shell: pwsh
        run: |
          $exe = Join-Path "${{ github.workspace }}" "artifact\\single\\ImpulsaExplorer.exe"
          if (-not (Test-Path $exe)) { throw "Single executable was not generated" }
          Get-Item $exe | Format-List FullName,Length,LastWriteTime

      - name: Upload Clover single EXE
        uses: actions/upload-artifact@v4
        with:
          name: ImpulsaExplorer-CLOVER-SINGLE-EXE
          path: artifact/single/ImpulsaExplorer.exe
          if-no-files-found: error
          retention-days: 7
