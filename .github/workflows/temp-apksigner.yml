name: Temp APK Signer

on:
  push:
    paths:
      - '.github/workflows/temp-apksigner.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Install official Debian apksigner
        run: |
          sudo apt-get update
          sudo apt-get install -y apksigner libapksig-java
      - name: Collect signer files
        run: |
          mkdir -p out
          cp -a /usr/bin/apksigner out/apksigner
          cp -a /usr/share/java/apksigner*.jar out/ 2>/dev/null || true
          cp -a /usr/share/java/apksig*.jar out/ 2>/dev/null || true
          cp -a /usr/lib/android-sdk/build-tools/debian/apksigner* out/ 2>/dev/null || true
          java -version
          /usr/bin/apksigner --version
          ls -lh out
      - name: Upload apksigner
        uses: actions/upload-artifact@v4
        with:
          name: temp-apksigner
          path: out/
          retention-days: 1
