name: Build CartaValor V02 APK

on:
  push:
    branches:
      - chatgpt-cartavalor-v02-build-20260927

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Reconstruct and unpack CartaValor source
        run: |
          cat \
            build-input/parts/part00.bin \
            build-input/parts/part01.bin \
            build-input/parts/part02.bin \
            build-input/parts/part03.bin \
            build-input/parts/part04.bin \
            build-input/parts/part05.bin \
            build-input/parts/part06.bin \
            build-input/parts/part07.bin \
            build-input/parts/part08.bin \
            build-input/parts/part09.bin \
            build-input/parts/part10.bin \
            > build-input/CartaValor_V02_con_IA_MEMORIA.zip
          unzip -t build-input/CartaValor_V02_con_IA_MEMORIA.zip
          unzip -q build-input/CartaValor_V02_con_IA_MEMORIA.zip -d .

      - name: Align JVM targets
        run: |
          perl -0pi -e 's/    buildFeatures \{/    compileOptions {\n        sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17\n    }\n\n    buildFeatures {/' CartaValor_V02/app/build.gradle.kts
          grep -A4 "compileOptions" CartaValor_V02/app/build.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK 35
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: CartaValor_V02
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          test -f CartaValor_V02/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose CartaValor_V02/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CartaValor_V02-debug-apk
          path: CartaValor_V02/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
