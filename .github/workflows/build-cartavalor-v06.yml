name: Build CartaValor V06 APK

on:
  push:
    branches:
      - chatgpt-cartavalor-v06-build-20260928

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Reconstruct CartaValor V03 base
        run: |
          cat \
            build-input/parts/part00.bin \
            build-input/parts/part01.bin \
            build-input/parts/part02.bin \
            build-input/parts/part03.bin \
            build-input/parts/part04.bin \
            build-input/parts/part05.bin \
            build-input/parts/part06.bin \
            build-input/parts/part07.bin \
            build-input/parts/part08.bin \
            build-input/parts/part09.bin \
            build-input/parts/part10.bin \
            > build-input/CartaValor_V03_source.zip
          unzip -t build-input/CartaValor_V03_source.zip
          unzip -q build-input/CartaValor_V03_source.zip -d .

      - name: Apply V04 visual matching
        run: |
          cd CartaValor_V03
          patch -p1 < ../v04patch/v04.patch
          sed -i '/import androidx.compose.foundation.layout.weight/d' app/src/main/java/uy/impulsa/cartavalor/MainActivity.kt
          cp ../v04patch/VisualSimilarityMatcher.kt app/src/main/java/uy/impulsa/cartavalor/VisualSimilarityMatcher.kt

      - name: Apply V05 OCR recovery
        run: |
          cp v05patch/OcrAnalyzer.kt CartaValor_V03/app/src/main/java/uy/impulsa/cartavalor/OcrAnalyzer.kt
          cp v05patch/CardRepository.kt CartaValor_V03/app/src/main/java/uy/impulsa/cartavalor/CardRepository.kt
          sed -i 's/val found = repo.search(name, n)/val found = repo.searchWithFallback(name, n, guess.rawText)/' CartaValor_V03/app/src/main/java/uy/impulsa/cartavalor/MainActivity.kt
          sed -i 's/V04 · Pokémon · USD \/ UYU/V05 · Pokémon · USD \/ UYU/' CartaValor_V03/app/src/main/java/uy/impulsa/cartavalor/MainActivity.kt
          sed -i 's/No encontré candidatos para comparar. Probá corregir el nombre o número y volver a buscar./No pude identificar la carta automáticamente. Probá otra foto con menos reflejo o escribí el nombre si lo conocés./' CartaValor_V03/app/src/main/java/uy/impulsa/cartavalor/MainActivity.kt

      - name: Apply V06 framing and crop
        run: |
          cp v06patch/PhotoOcrProcessor.kt CartaValor_V03/app/src/main/java/uy/impulsa/cartavalor/PhotoOcrProcessor.kt
          python3 - <<'PY'
          from pathlib import Path
          p = Path("CartaValor_V03/app/src/main/java/uy/impulsa/cartavalor/MainActivity.kt")
          s = p.read_text()
          s = s.replace(
              '            cameraSelector = CameraSelector.DEFAULT_BACK_CAMERA\n            setEnabledUseCases(CameraController.IMAGE_ANALYSIS or CameraController.IMAGE_CAPTURE)',
              '            cameraSelector = CameraSelector.DEFAULT_BACK_CAMERA\n            setTapToFocusEnabled(true)\n            setPinchToZoomEnabled(true)\n            setEnabledUseCases(CameraController.IMAGE_ANALYSIS or CameraController.IMAGE_CAPTURE)',
              1
          )
          s = s.replace(
              '        controller.bindToLifecycle(lifecycleOwner)\n        onDispose {',
              '        controller.bindToLifecycle(lifecycleOwner)\n        runCatching { controller.setZoomRatio(1.20f) }\n        onDispose {',
              1
          )
          s = s.replace(
              '.fillMaxWidth(0.78f)\n                .aspectRatio(0.72f)\n                .border(3.dp, Color(0xFFFFC928), RoundedCornerShape(16.dp))',
              '.fillMaxWidth(0.92f)\n                .aspectRatio(0.72f)\n                .border(4.dp, Color(0xFFFFC928), RoundedCornerShape(18.dp))',
              1
          )
          anchor = '''        Button(
              onClick = ::takePhoto,
              enabled = !capturing,
              modifier = Modifier.align(Alignment.BottomCenter).padding(14.dp)
          ) {'''
          label = '''        Text(
              "Acercá la carta hasta llenar el marco · tocá sobre el nombre para enfocar",
              color = Color.White,
              fontSize = 12.sp,
              fontWeight = FontWeight.SemiBold,
              modifier = Modifier.align(Alignment.TopCenter)
                  .padding(12.dp)
                  .background(Color(0xAA000000), RoundedCornerShape(10.dp))
                  .padding(horizontal = 10.dp, vertical = 6.dp)
          )
          ''' + anchor
          s = s.replace(anchor, label, 1)
          s = s.replace('V05 · Pokémon · USD / UYU', 'V06 · Pokémon · USD / UYU', 1)
          p.write_text(s)
          PY
          sed -i 's/versionCode = 4/versionCode = 6/' CartaValor_V03/app/build.gradle.kts
          sed -i 's/versionName = "4.0"/versionName = "6.0"/' CartaValor_V03/app/build.gradle.kts
          grep -E 'versionCode|versionName' CartaValor_V03/app/build.gradle.kts
          grep -n 'fillMaxWidth(0.92f)' CartaValor_V03/app/src/main/java/uy/impulsa/cartavalor/MainActivity.kt
          grep -n 'setZoomRatio' CartaValor_V03/app/src/main/java/uy/impulsa/cartavalor/MainActivity.kt
          grep -n 'Acercá la carta' CartaValor_V03/app/src/main/java/uy/impulsa/cartavalor/MainActivity.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK 35
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build V06 debug APK
        working-directory: CartaValor_V03
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify V06 APK
        run: |
          test -f CartaValor_V03/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose CartaValor_V03/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload V06 APK
        uses: actions/upload-artifact@v4
        with:
          name: CartaValor_V06-debug-apk
          path: CartaValor_V03/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
